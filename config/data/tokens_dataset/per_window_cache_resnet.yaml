class: "PerWindowCachedTokensDataset"             # The BaseWindowedDataset class to use
window_size: 512                                  # Size of windows to cut from tokenized sequences.
num_windows_per_model: "auto"                     # Number of windows to sample per model. Can be an integer or "auto" for full coverage.
pad_windows: True                                 # Whether to pad windows smaller than window_size with padding tokens.
allow_overlapping_windows: False                  # Whether to allow overlapping windows
window_distribution_strategy: "consecutive"       # Strategy for distributing non-overlapping windows. Options: "consecutive" (start from beginning), "distributed" (spread across sequence).

# Disk caching configuration (reduces memory usage for large datasets)
cache_dir: null                                   # Cache directory (null = default ~/.sane/cache/tokens)
